<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" fill="none">
  <defs>
    <linearGradient id="cmpGoldArea" x1="800" y1="30" x2="800" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6A32A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFF1C7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cmpTrendLine" x1="380" y1="215" x2="1175" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6A32A" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#D6A32A" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#73520A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cmpVolLine" x1="380" y1="145" x2="1175" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#73520A" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#D6A32A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#73520A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Subtle Comparative Matrix Grid -->
  <g stroke="#D6A32A" stroke-opacity="0.11" stroke-width="1">
    <line x1="400" y1="50" x2="1180" y2="50" stroke-dasharray="4 6"/>
    <line x1="400" y1="130" x2="1180" y2="130"/>
    <line x1="400" y1="210" x2="1180" y2="210" stroke-dasharray="4 6"/>
    <line x1="560" y1="20" x2="560" y2="240"/>
    <line x1="790" y1="20" x2="790" y2="240"/>
    <line x1="1020" y1="20" x2="1020" y2="240"/>
  </g>

  <!-- Soft Golden Area Under Comparative Curves -->
  <path d="M 380 218 C 520 198, 640 162, 790 126 C 930 92, 1050 66, 1175 40 L 1175 245 L 380 245 Z"
        fill="url(#cmpGoldArea)"/>

  <!-- Strategy 1 Trajectory: Smooth Ascending Trend Curve -->
  <path d="M 380 218 C 480 206, 560 174, 650 168 C 740 162, 810 116, 900 108 C 990 100, 1075 58, 1175 40"
        stroke="url(#cmpTrendLine)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- Strategy 2 Trajectory: Oscillating Mean-Reversion Wave -->
  <path d="M 380 154 C 430 112, 475 204, 530 142 C 585 82, 635 194, 695 130 C 755 68, 805 184, 865 118 C 925 54, 980 168, 1040 102 C 1095 44, 1135 136, 1175 84"
        stroke="url(#cmpVolLine)" stroke-width="2.4" stroke-dasharray="6 4" stroke-linecap="round" fill="none"/>

  <!-- Comparative Bar Pairs along the timeline -->
  <g opacity="0.38">
    <rect x="490" y="156" width="8" height="44" rx="2" fill="#73520A"/>
    <rect x="501" y="170" width="8" height="30" rx="2" fill="#D6A32A"/>

    <rect x="640" y="138" width="8" height="62" rx="2" fill="#73520A"/>
    <rect x="651" y="150" width="8" height="50" rx="2" fill="#D6A32A"/>

    <rect x="935" y="96" width="8" height="104" rx="2" fill="#73520A"/>
    <rect x="946" y="118" width="8" height="82" rx="2" fill="#D6A32A"/>

    <rect x="1085" y="68" width="8" height="132" rx="2" fill="#73520A"/>
    <rect x="1096" y="92" width="8" height="108" rx="2" fill="#D6A32A"/>
  </g>

  <!-- Central-Right Equilibrium / Versus Medallion -->
  <g transform="translate(790, 128)" opacity="0.58">
    <circle cx="0" cy="0" r="36" fill="#FFF1C7" fill-opacity="0.7" stroke="#D6A32A" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#73520A" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- Subtle Balance / Versus Geometry -->
    <path d="M -14 -6 L -6 10 L 0 -6 M 4 8 C 4 11, 14 11, 14 5 C 14 0, 4 0, 4 -5 C 4 -10, 14 -10, 14 -6"
          stroke="#73520A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Intersection & Milestone Nodes -->
  <g fill="#D6A32A" opacity="0.65">
    <circle cx="530" cy="142" r="4.5" fill="#73520A"/>
    <circle cx="650" cy="168" r="4.5"/>
    <circle cx="900" cy="108" r="5" fill="#73520A"/>
    <circle cx="1040" cy="102" r="4.5"/>
    <circle cx="1175" cy="40" r="6" fill="#73520A"/>
    <circle cx="1175" cy="84" r="5" fill="#D6A32A"/>
  </g>
</svg>
